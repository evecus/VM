name: Build VM

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如 1.0.0)'
        required: true
        type: string

jobs:
  # ─── Build Rust Server ──────────────────────────────────────────
  build-server:
    name: Build Server (Rust) (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            suffix: linux-amd64
          - target: aarch64-unknown-linux-musl
            suffix: linux-arm64
          - target: armv7-unknown-linux-musleabihf
            suffix: linux-armv7

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            musl-tools \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabihf

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          key: rust-${{ matrix.target }}-${{ hashFiles('server/Cargo.lock') }}
          restore-keys: rust-${{ matrix.target }}-

      - name: Build
        working-directory: server
        env:
          VM_VERSION: ${{ github.event.inputs.version }}
        run: |
          cross build --release --target ${{ matrix.target }}
          mkdir -p ../dist
          cp target/${{ matrix.target }}/release/vm-server \
             ../dist/vm-server-${{ matrix.suffix }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.suffix }}
          path: dist/vm-server-${{ matrix.suffix }}

  # ─── Build Flutter APK ──────────────────────────────────────────
  build-client:
    name: Build Client (Flutter APK)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true

      - name: Set version
        working-directory: client
        run: |
          VERSION="${{ github.event.inputs.version }}"
          CODE=$(echo "$VERSION" | awk -F. '{ printf "%d%02d%02d", $1, $2, $3 }')
          sed -i "s/^version: .*/version: ${VERSION}+${CODE}/" pubspec.yaml
          echo "Set version: ${VERSION}+${CODE}"

      - name: Flutter pub get
        working-directory: client
        run: |
          rm -f pubspec.lock
          flutter pub get

      - name: Flutter analyze
        working-directory: client
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Build APK (release)
        working-directory: client
        run: flutter build apk --release --split-per-abi

      - name: Rename APKs
        run: |
          mkdir -p dist
          cp client/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk   dist/vm-arm64.apk
          cp client/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/vm-armv7.apk
          cp client/build/app/outputs/flutter-apk/app-x86_64-release.apk      dist/vm-x86_64.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: client-apks
          path: dist/*.apk

  # ─── Create Release ─────────────────────────────────────────────
  release:
    name: Create Release
    needs: [build-server, build-client]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List dist
        run: ls -lh dist/

      - name: Prepare extras
        run: |
          cp server/config.yaml.example dist/config.yaml.example || true
          cp server/vm-server.service    dist/vm-server.service   || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: VM v${{ github.event.inputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/vm-server-linux-amd64
            dist/vm-server-linux-arm64
            dist/vm-server-linux-armv7
            dist/vm-arm64.apk
            dist/vm-armv7.apk
            dist/vm-x86_64.apk
            dist/config.yaml.example
            dist/vm-server.service
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
